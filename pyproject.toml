[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-sensor-baseline"
# Read from `src/fleet_sensor_baseline/__init__.py` rather than written here.
# Two literals that happen to agree is the arrangement that drifts: nothing
# reads the packaging one, so a bump in the wrong place ships a wheel whose
# `__version__` disagrees with its own metadata and no check notices.
dynamic = ["version"]
description = "Which units differ from their cohort, and what changed across time."
readme = "README.md"
requires-python = ">=3.10"

# PEP 639 SPDX expression. Deliberately NO `License :: OSI Approved ::`
# classifier: the index rejects the two together, and a clean local build is not
# the check for that.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "James Sheen" }]
keywords = ["openbmc", "redfish", "bmc", "fleet", "sensors", "drift",
            "baseline", "hardware"]

# **No dependencies, on purpose.** Ingest, baseline, outliers, drift, verdict
# and validate are JSON and arithmetic, so the vertical and horizontal axes run
# on a jump host with nothing provisioned. The referee arrives only with the
# collector, and only because `collect` needs the COMMAND on PATH.
dependencies = []

[project.optional-dependencies]
# **The floor is DERIVED, not chosen, and the derivation is the point.** This
# collector calls `bmc-sensor-audit validate-walk` and reads the handle printed
# by `capture --print-digest`. Both were measured against every published
# release inside the range before this line was written:
#
#     0.1.0   validate-walk ABSENT, capture --print-digest ABSENT
#     0.1.1   both present
#
# The specification this repository was built from pinned `>=0.1.0,<0.2` while
# describing an implementation that calls both -- a pin is a claim about every
# release in its range, and that one was false at its own floor.
#
# **Raised to 0.1.2 on 2026-08-25**: the collector passes `--password-env` so a
# credential never crosses argv, and declares an added aggregation prefix in one
# entry. Neither exists in 0.1.1.
#
# **Raised again to 0.1.3 the same day**, and this one is the sharpest: the
# backend used to tell a skipped walk from a real one by matching a printed
# SENTENCE, because that was the only signal there was. 0.1.3 prints an
# `OUTCOME ` line and declares it contract. Reported from here as issue #6 --
# against a fix written here an hour earlier -- and consuming it is what turns
# a prose match into a promise.
#
# **Raised again to 0.1.4**, and this one is a defect this repository FOUND.
# Taking `--pin-sha256` meant writing a test that pinned a wrong certificate and
# expected the walk to fail. It passed: urllib picks a handler by scheme, so the
# pinned HTTPS handler was never consulted for an `http://` URL and the flag was
# silently dropped. 0.1.4 refuses that. **A security flag that is ignored is
# worse than one that does not exist**, so the floor moves with it.
#
# **And again to 0.1.5, from the same test.** The 0.1.4 refusal was correct and
# UNCAUGHT: `capture` crashed and exited 1, which means FINDINGS in this
# family's vocabulary -- so a collector read a misconfigured flag as a machine
# with problems. 0.1.5 makes it exit 2. Two defects in one feature, both found
# by writing the end-to-end test honestly rather than by inspecting a client.
#
# **And to 0.2.0, which is what arms the version probe.** From 0.2.0 the referee
# answers `--version`, so a referee that cannot report one is CONCLUSIVELY below
# this floor rather than merely old, and `preflight()` can refuse instead of
# saying it could not tell. That is the whole reason this floor moved: the check
# was written before the thing it checks existed.
collect = ["bmc-sensor-audit>=0.2.0,<0.3"]
dev = ["pytest>=7"]

[project.scripts]
fleet-sensor-baseline = "fleet_sensor_baseline.cli:main"

# An index page with no way back to the source is a dead end for the one reader
# who wants to check a claim.
[project.urls]
Homepage = "https://github.com/james-sheen/fleet-sensor-baseline"
Source = "https://github.com/james-sheen/fleet-sensor-baseline"
Issues = "https://github.com/james-sheen/fleet-sensor-baseline/issues"

[tool.hatch.version]
path = "src/fleet_sensor_baseline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_sensor_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Registered rather than left implicit, so an unknown-marker typo is an error
# instead of a test that silently belongs to no lane.
markers = [
  "seam: needs bmc-sensor-audit installed; exercises the upstream seam",
]
