# The suite twice, because the two lanes answer different questions.
#
# The dependency-free lane is what a jump host gets: ingest, baseline, outliers,
# drift, verdict and validate, on the standard library alone. If that lane needs
# something installed, the claim in the README stopped being true.
#
# The referee lane unskips the seam. Those 14 are the only tests that can notice
# the upstream format string changing, `validate-walk` refusing what `capture`
# wrote, or the printed digest ceasing to describe the file -- and none of them
# can run without the tool. **A suite that only ever ran the first lane would be
# green on a broken seam**, which is exactly what the skips say in prose.
#
# The referee is pinned as a range. Any 0.1.x release lands here without this
# repository changing, which is precisely the seam the second lane can notice.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them and exactly one was
  # ever run. In a sibling repository that gap hid two end-to-end tests that had
  # been erroring since 3.13, and every host this family is deployed on runs
  # 3.14.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ".[dev]"
          python3 -m pytest tests/ -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what `test_a_tag_and_the_tree_do_not_disagree` reads, and
          # `fetch-depth: 1` fetches none of them. The check answers *cannot
          # tell* in that case rather than *no tags*, which is honest and is
          # also not the answer we came for.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, dependency-free
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e ".[dev]"

      - name: The dependency-free lane
        # Expected: some tests skip, and every one of them says why. A skip here
        # is the seam being unchecked, not the seam being fine.
        run: python3 -m pytest tests/ -q -rs

      - name: Nothing was installed behind our back
        # The claim in the README and in NOTICE is that the core imports no
        # third-party package. This is the check for it -- an import that crept
        # into `store.py` would still pass the lane above on a runner where the
        # referee happened to be present.
        run: |
          set -euo pipefail
          python3 -c "
          import importlib, sys
          sys.path.insert(0, 'src')
          assert 'bmc_sensor_audit' not in sys.modules
          for name in ('store', 'formats', 'baseline', 'outliers', 'drift',
                       'verdict', 'walk', 'report', 'exits', 'cli'):
              importlib.import_module('fleet_sensor_baseline.' + name)
          leaked = sorted(m for m in sys.modules if m.startswith('bmc_sensor_audit'))
          assert not leaked, f'the core pulled in {leaked}'
          print('  core imports nothing from the referee')
          "

      - name: Install the referee
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -e ".[collect,dev]"
          python3 -m pip show bmc-sensor-audit | sed -n 's/^Version: /  referee /p'

      - name: The referee lane -- the seam, unskipped
        run: python3 -m pytest tests/ -q

      - name: The seam lane is not empty
        # Non-vacuity. If the marker were dropped from every test, the step
        # above would still be green and would be testing nothing upstream.
        run: |
          set -euo pipefail
          collected=$(python3 -m pytest tests/ -m seam --collect-only -q \
            | sed -n 's#^\([0-9]\+\)/[0-9]\+ tests collected.*#\1#p')
          echo "  seam tests: ${collected:-0}"
          test "${collected:-0}" -gt 0

      - name: The publication vocabulary, over the tree
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED

      - name: A mock rack, end to end
        # 0.3's exit criterion, stated as a command: a verdict produced from
        # nothing but BMC endpoints. It runs against fake machines, which is the
        # only tier available without hardware -- and it is the tier the exit
        # criterion names.
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_seam.py::TestTheCollectorAgainstAMockRack -q

      - name: The same suite, from the sdist this tree builds
        # THE ARTIFACT, NOT THE CHECKOUT. A packager or a reviewer runs the suite
        # from the sdist, and on 2026-09-26 five of the nine sdists in this family
        # could not: each carried tests/ without files those tests import or open,
        # so collection stopped and nothing ran, while twine, the metadata and a
        # clean wheel install all passed over it. So the suite runs again from the
        # unpacked sdist and from `git archive HEAD`, neither with a `.git`, and
        # every test must answer the same on both sides: a test that needs a
        # repository skips on both, and a file the sdist leaves out cannot hide.
        # The package is reinstalled from the sdist first, so what imports is
        # what a wheel built from the artifact would install.
        env:
          REINSTALL: "yes"
          PRE: ""
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP:-/tmp}/sdist-check"
          rm -rf "${T}" && mkdir -p "${T}/tree" "${T}/unpacked"
          git archive HEAD | tar -x -C "${T}/tree"
          python3 -m pip install --quiet build
          python3 -m build --sdist --outdir "${T}/dist" . > "${T}/build.log"
          tar -xzf "${T}"/dist/*.tar.gz -C "${T}/unpacked" --strip-components=1
          test ! -e "${T}/unpacked/.git"
          if [ "${REINSTALL}" = yes ]; then
            (cd "${T}/unpacked" && python3 -m pip install --quiet --no-deps --force-reinstall .)
          fi
          for side in tree unpacked; do
            (cd "${T}/${side}" && { [ -z "${PRE}" ] || python3 ${PRE} > /dev/null; } \
               && python3 -m pytest tests/ -q -p no:cacheprovider --junitxml="${T}/${side}.xml") \
               > "${T}/${side}.log" 2>&1 || true
          done
          python3 - "${T}" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          T = pathlib.Path(sys.argv[1])
          def outcomes(side):
              report = T / f"{side}.xml"
              if not report.is_file():
                  print((T / f"{side}.log").read_text()[-3000:])
                  sys.exit(f"::error::the {side} run wrote no report")
              out = {}
              for case in ET.parse(report).getroot().iter("testcase"):
                  kinds = {child.tag for child in case}
                  out[f"{case.get('classname')}::{case.get('name')}"] = (
                      "failed" if "failure" in kinds else "error" if "error" in kinds
                      else "skipped" if "skipped" in kinds else "passed")
              return out
          tree, sdist = outcomes("tree"), outcomes("unpacked")
          if not tree:
              sys.exit("::error::the tracked tree collected nothing, so there is nothing to compare")
          broken = sorted(k for k, v in sdist.items() if v in ("failed", "error"))
          missing = sorted(set(tree) - set(sdist))
          extra = sorted(set(sdist) - set(tree))
          changed = sorted(k for k in set(tree) & set(sdist) if tree[k] != sdist[k])
          for label, keys in (("fails when run from the sdist", broken),
                              ("is in the tree and not in the sdist", missing),
                              ("is in the sdist and not in the tree", extra),
                              ("answers differently from the sdist", changed)):
              for key in keys[:25]:
                  print(f"::error::{key} {label} (tree: {tree.get(key)}, sdist: {sdist.get(key)})")
          if broken or missing or extra or changed:
              print((T / "unpacked.log").read_text()[-3000:])
              sys.exit(1)
          count = lambda outcome: sum(1 for v in sdist.values() if v == outcome)
          print(f"  the sdist answers exactly as the tracked tree does: {len(sdist)} tests, "
                f"{count('passed')} passed, {count('skipped')} skipped")
          PY
